# Simulation Parameters
simulation:
  simulation_steps: 1428  # same as original (238 min at 10s intervals)
  seed: 42
  unit_time: 10
  assign_flows_type: "classic"
  path_finder:
    k_paths: 1
    theta: 10
    alpha: 1
    beta: 0.5
    omega: 0.8

# Controller Configuration
# controllers:
#   enabled: false
#   nodes: []

# Default Link Parameters
default_link:
  length: 50
  width: 8
  free_flow_speed: 1.1
  k_critical: 2
  k_jam: 6
  fd_type: "yperman"
  activity_probability: 0.5
  gamma: 0.1
  speed_noise_std: 0.01

# Demand Configuration - all OD nodes use data-driven demand
